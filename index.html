<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng Điểm Tổng Kết Học Tập</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background-color: #f0f7ff; /* Nền xanh xám nhạt giống mẫu */
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-top: 40px;
        }

        /* Tiêu đề bảng */
        .title {
            font-size: 24px;
            font-weight: bold;
            color: #1e3a5f;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Khung bảng */
        .table-container {
            background-color: #ffffff;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1); /* Đổ bóng xung quanh bảng */
            border-radius: 4px;
            overflow: hidden;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            min-width: 500px;
        }

        /* Hàng tiêu đề màu vàng */
        th {
            background-color: #ffd700;
            color: #000000;
            font-weight: bold;
            padding: 12px 20px;
            text-align: center;
            border: 1.5px solid #0088ff;
            font-size: 15px;
        }

        /* Các ô dữ liệu */
        td {
            padding: 12px 20px;
            border: 1.5px solid #0088ff;
            color: #333333;
            font-size: 15px;
            background-color: #ffffff;
        }

        /* Căn trái cho cột Họ và Tên, căn giữa cho điểm số */
        td:first-child {
            text-align: left;
            padding-left: 25px;
        }

        td:not(:first-child) {
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Tiêu đề -->
    <div class="title">
        📊 Bảng Điểm Tổng Kết Học Tập
    </div>

    <!-- Bảng dữ liệu -->
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Họ và Tên</th>
                    <th>Toán</th>
                    <th>Vật Lý</th>
                    <th>Hoá Học</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Vũ Mai Phương</td>
                    <td>8.5</td>
                    <td>9.0</td>
                    <td>8.8</td>
                </tr>
                <tr>
                    <td>Vũ Giang Linh</td>
                    <td>9.2</td>
                    <td>8.5</td>
                    <td>9.0</td>
                </tr>
                <tr>
                    <td>Nguyễn Thuỳ Chi</td>
                    <td>7.8</td>
                    <td>8.2</td>
                    <td>8.5</td>
                </tr>
                <tr>
                    <td>Vũ Thị Ngọc Anh</td>
                    <td>8.0</td>
                    <td>9.2</td>
                    <td>9.0</td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>
